[workspace]
resolver = "3"
members = ["crates/saola-tokens", "crates/saola-theme", "crates/saola-export-alacritty"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
iced = { version = "0.14", default-features = false, features = ["wayland", "thread-pool"] }
