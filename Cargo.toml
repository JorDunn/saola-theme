[workspace]
resolver = "3"
members = ["crates/saola-tokens", "crates/saola-theme", "crates/saola-export-alacritty"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
# "canvas" is for `saola_theme::canvas` (the selection-chrome token bridge):
# a scrim-with-a-hole, a dashed selection edge, and resize handles are frame
# drawing, not widget styles — no renderer backend is pulled in (that choice
# still belongs to consumers).
iced = { version = "0.14", default-features = false, features = ["wayland", "thread-pool", "canvas"] }
