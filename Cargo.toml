[workspace]
resolver = "3"
members = ["crates/saola-tokens", "crates/saola-theme", "crates/saola-export-alacritty"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
# "svg" and "canvas" are lib features (not left to consumers like the
# renderer choice): the shared icon module embeds and draws SVG assets
# (`iced::widget::svg` only exists with "svg" on), and `saola_theme::canvas`
# (the selection-chrome token bridge) is frame drawing that needs the
# "canvas" widget API. Neither pulls in a renderer backend — that choice
# still belongs to consumers.
iced = { version = "0.14", default-features = false, features = ["wayland", "thread-pool", "svg", "canvas"] }
