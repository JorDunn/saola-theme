[workspace]
resolver = "3"
members = ["crates/saola-tokens", "crates/saola-theme", "crates/saola-export-alacritty"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
# "svg" is a lib feature (not left to consumers like the renderer choice)
# because saola-theme's shared icon module embeds and draws SVG assets —
# `iced::widget::svg` only exists with the feature on, so the crate doesn't
# compile without it. Renderer choice still belongs to consumers.
iced = { version = "0.14", default-features = false, features = ["wayland", "thread-pool", "svg"] }
